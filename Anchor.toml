[toolchain]
anchor_version = "0.32.1"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
membership_distribution = "GY6CCBRP3qnEZaHF2W6JebgD3sW73rLb7xoafMGUiGzF"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "https://api.devnet.solana.com"
wallet = "~/.config/solana/id.json"

[scripts]
# Har step ki alag command
phase1 = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 scripts/initialize.ts"
phase2 = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 scripts/register.ts"
phase3 = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 scripts/lock.ts"
